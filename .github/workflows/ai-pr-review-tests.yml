name: AI PR review tests

on:
  pull_request:
    paths:
      - '.github/review-agent/**'
      - '.github/workflows/ai-pr-review*.yml'
      - 'docs/ai-pr-review.md'
  push:
    branches: [main, develop]
    paths:
      - '.github/review-agent/**'
      - '.github/workflows/ai-pr-review*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: AI PR review - offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise worker without network, Azure or secrets
        run: python3 -I -m unittest discover -s .github/review-agent -p 'test_*.py' -v
