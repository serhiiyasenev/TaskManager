name: Controlled full-stack verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fullstack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  runner-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hash-verified pinned PowerShell and workflow validator
        shell: pwsh
        run: |
          $tools = ./scripts/azure/Install-Tools.ps1 -Tools PowerShell,Actionlint
          "TM_PWSH=$($tools.PowerShell)" >> $env:GITHUB_ENV
          "TM_ACTIONLINT=$($tools.Actionlint)" >> $env:GITHUB_ENV
      - name: Actual native child timeout/privacy/cleanup fixtures
        shell: pwsh
        run: |
          & $env:TM_PWSH -NoProfile -File scripts/fullstack/tests/Run.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:TM_PWSH -NoProfile -File scripts/fullstack/tests/Live.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native workflow validation
        shell: pwsh
        run: |
          & $env:TM_ACTIONLINT -shellcheck='' -pyflakes='' .github/workflows/fullstack.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  actual-local-stack:
    needs: runner-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: TaskManager_FullStack_CI_Aa9!
        ports: ['1433:1433']
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TaskManager_FullStack_CI_Aa9! -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval=10s --health-timeout=5s --health-retries=30
      rabbitmq:
        image: rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
        env:
          RABBITMQ_DEFAULT_USER: taskmanager-fullstack-ci
          RABBITMQ_DEFAULT_PASS: TaskManager_FullStack_Rabbit_Disposable
        ports: ['5672:5672']
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # Ephemeral CI services only; no saved secrets or cloud credentials.
      TASKMANAGER_FULLSTACK_SQL: 'Server=127.0.0.1,1433;Database=master;User Id=sa;Password=TaskManager_FullStack_CI_Aa9!;Encrypt=True;TrustServerCertificate=True'
      TASKMANAGER_FULLSTACK_RABBIT_HOST: '127.0.0.1'
      TASKMANAGER_FULLSTACK_RABBIT_PORT: '5672'
      TASKMANAGER_FULLSTACK_RABBIT_USER: taskmanager-fullstack-ci
      TASKMANAGER_FULLSTACK_RABBIT_PASSWORD: TaskManager_FullStack_Rabbit_Disposable
      TASKMANAGER_UI_BROWSER: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned PowerShell
        shell: pwsh
        run: |
          $tools = ./scripts/azure/Install-Tools.ps1 -Tools PowerShell
          "TM_PWSH=$($tools.PowerShell)" >> $env:GITHUB_ENV
      - name: Prepare actual locked product UI and isolated CI browser
        run: |
          npm install --global npm@12.2.0 --ignore-scripts
          npm ci --ignore-scripts
          npm run build:frontend
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Build actual test-only host sequentially
        run: |
          dotnet restore tools/TaskManager.FullStackHost/TaskManager.FullStackHost.csproj --locked-mode -warnaserror:NU1901,NU1902,NU1903,NU1904
          dotnet build tools/TaskManager.FullStackHost/TaskManager.FullStackHost.csproj --configuration Release --no-restore -warnaserror:NU1901,NU1902,NU1903,NU1904
      - name: Actual HTTPS Identity/SQL/Rabbit/SignalR product workflows
        shell: pwsh
        run: |
          & $env:TM_PWSH -NoProfile -File scripts/fullstack/Run.ps1 -Mode RabbitMQ -NoBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve sanitized aggregate result and explicit synthetic product screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controlled-fullstack-${{ github.run_id }}
          path: |
            tests/frontend/test-results/fullstack-summary.json
            tests/frontend/test-results/fullstack-screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore
          archive: true
      # No .local/private state, Playwright traces/video, stdout, logs or live
      # Azure promotion evidence are uploaded. This gate has no id-token access.
