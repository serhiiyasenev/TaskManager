name: Trusted Azure delivery
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment containing reviewed Azure configuration
        required: true
        type: choice
        options: [taskmanager-staging, taskmanager-production]
      operation:
        description: Explicit operation; release prepares a candidate, promotion is separate
        required: true
        type: choice
        options: [validate, foundation, release, promote, rollback]
      release_sha:
        description: Existing full main commit for promote/rollback; empty uses current main
        required: false
        type: string
      release_run_id:
        description: Exact trusted release workflow run for promotion or rollback
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: taskmanager-azure-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  delivery:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_CONFIG_DIR: ${{ github.workspace }}/.local/azure/cli-config
      DOCKER_CONFIG: ${{ github.workspace }}/.local/azure/docker-config
      AZURE_EXTENSION_USE_DYNAMIC_INSTALL: 'no'
      TM_CONFIG_JSON: ${{ vars.TASKMANAGER_AZURE_CONFIG_JSON }}
      TM_PRICING_JSON: ${{ vars.TASKMANAGER_AZURE_PRICING_INPUTS_JSON }}
      TM_INPUT_ENVIRONMENT: ${{ inputs.environment }}
      TM_OPERATION: ${{ inputs.operation }}
      TM_RELEASE_SHA: ${{ inputs.release_sha }}
      TM_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install pinned tools and save reviewed private configuration
        shell: pwsh
        run: |
          $tools = ./scripts/azure/Install-Tools.ps1 -Tools Bicep,AzureCli,PowerShell
          "TM_PWSH=$($tools.PowerShell)" >> $env:GITHUB_ENV
          "TM_BICEP=$($tools.Bicep)" >> $env:GITHUB_ENV
          "TM_AZ=$($tools.AzureCli)" >> $env:GITHUB_ENV
          (Split-Path $tools.AzureCli -Parent) >> $env:GITHUB_PATH
          . ./scripts/azure/Validation.ps1
          $path = Join-Path $env:GITHUB_WORKSPACE '.local/azure/config.json'
          Save-TaskManagerPrivateJson $path ($env:TM_CONFIG_JSON | ConvertFrom-Json -AsHashtable -Depth 100)
          $config = Read-TaskManagerConfiguration $path
          if ($config.githubEnvironment -cne $env:TM_INPUT_ENVIRONMENT) { throw 'Protected environment and reviewed configuration differ.' }
          "TM_CONFIG=$path" >> $env:GITHUB_ENV
          "TM_SUBSCRIPTION=$($config.subscriptionId)" >> $env:GITHUB_ENV
          "TM_TENANT=$($config.tenantId)" >> $env:GITHUB_ENV
          $sha = if ($env:TM_RELEASE_SHA) { $env:TM_RELEASE_SHA } else { $env:GITHUB_SHA }
          if ($sha -cnotmatch '^[a-f0-9]{40}$') { throw 'Full reviewed commit SHA required.' }
          if ($env:TM_OPERATION -in @('validate','foundation','release') -and $sha -cne $env:GITHUB_SHA) { throw 'New delivery must build the current trusted main checkout.' }
          "TM_SHA=$sha" >> $env:GITHUB_ENV
          "TM_STATE_DIR=$($env:GITHUB_WORKSPACE)/.local/azure/$($config.foundation.environmentName)/$sha" >> $env:GITHUB_ENV
      - name: Fetch and gate the current region/meter cost worksheet
        if: inputs.operation == 'foundation' || inputs.operation == 'release'
        shell: pwsh
        run: |
          . ./scripts/azure/Common.ps1
          Save-TaskManagerPrivateJson .local/azure/pricing-inputs.json ($env:TM_PRICING_JSON | ConvertFrom-Json -AsHashtable -Depth 100)
          & $env:TM_PWSH -NoProfile -File scripts/azure/Get-CostEstimate.ps1 -ConfigurationPath $env:TM_CONFIG -PricingInputsPath .local/azure/pricing-inputs.json -OutputPath .local/azure/cost-estimate.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the exact trusted source run before artifact reuse
        if: inputs.operation == 'promote' || inputs.operation == 'rollback'
        shell: pwsh
        env:
          TM_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ($env:TM_RELEASE_RUN_ID -cnotmatch '^[0-9]{1,20}$' -or -not $env:TM_RELEASE_SHA) { throw 'Exact release run ID and full SHA are required.' }
          $source = Invoke-RestMethod -Uri "https://api.github.com/repos/serhiiyasenev/TaskManager/actions/runs/$env:TM_RELEASE_RUN_ID" -Headers @{ Authorization = "Bearer $env:TM_GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          if ($source.event -cne 'workflow_dispatch' -or $source.head_branch -cne 'main' -or $source.head_sha -cne $env:TM_SHA -or $source.path -cne '.github/workflows/azure-deploy.yml' -or $source.repository.full_name -cne 'serhiiyasenev/TaskManager' -or $source.status -cne 'completed') { throw 'Artifact source is not the exact completed trusted main delivery run.' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.operation == 'promote' || inputs.operation == 'rollback'
        with:
          name: taskmanager-release-${{ env.TM_SHA }}-${{ inputs.release_run_id }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          path: .local/azure/downloaded-journal
      - name: Inspect actual OIDC subject before signed federation login
        shell: pwsh
        run: |
          & $env:TM_PWSH -NoProfile -File scripts/azure/Inspect-Oidc.ps1 -ConfigurationPath $env:TM_CONFIG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.TM_TENANT }}
          subscription-id: ${{ env.TM_SUBSCRIPTION }}
          allow-no-subscriptions: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.operation == 'release'
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          buildkitd-flags: ''
      - name: Execute explicit reviewed operation
        shell: pwsh
        run: |
          $common = @('-ConfigurationPath', $env:TM_CONFIG, '-AzureCliPath', $env:TM_AZ)
          switch ($env:TM_OPERATION) {
            'validate' { & $env:TM_PWSH -NoProfile -File scripts/azure/Deploy.ps1 @common -CommitSha $env:TM_SHA -BicepPath $env:TM_BICEP -Mode Validate }
            'foundation' { & $env:TM_PWSH -NoProfile -File scripts/azure/Deploy.ps1 @common -CommitSha $env:TM_SHA -BicepPath $env:TM_BICEP -Mode Foundation }
            'release' {
              & $env:TM_PWSH -NoProfile -File scripts/azure/Deploy.ps1 @common -CommitSha $env:TM_SHA -BicepPath $env:TM_BICEP -Mode Foundation
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $env:TM_PWSH -NoProfile -File scripts/azure/Build-Images.ps1 @common -FoundationPath "$env:TM_STATE_DIR/foundation.json" -CommitSha $env:TM_SHA -ManifestPath "$env:TM_STATE_DIR/images.json"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $env:TM_PWSH -NoProfile -File scripts/azure/Deploy.ps1 @common -CommitSha $env:TM_SHA -BicepPath $env:TM_BICEP -Mode Release
            }
            'promote' {
              & $env:TM_PWSH -NoProfile -File scripts/azure/Restore-ReleaseJournal.ps1 -JournalPath .local/azure/downloaded-journal/release-journal.json -ConfigurationPath $env:TM_CONFIG -CommitSha $env:TM_SHA -OutputPath "$env:TM_STATE_DIR/release.json"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $env:TM_PWSH -NoProfile -File scripts/azure/Promote.ps1 @common -ReleasePath "$env:TM_STATE_DIR/release.json"
            }
            'rollback' {
              & $env:TM_PWSH -NoProfile -File scripts/azure/Restore-ReleaseJournal.ps1 -JournalPath .local/azure/downloaded-journal/release-journal.json -ConfigurationPath $env:TM_CONFIG -CommitSha $env:TM_SHA -OutputPath "$env:TM_STATE_DIR/release.json"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $env:TM_PWSH -NoProfile -File scripts/azure/Rollback.ps1 @common -ReleasePath "$env:TM_STATE_DIR/release.json"
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export selected recovery journal
        if: always() && inputs.operation != 'validate' && inputs.operation != 'foundation'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "$env:TM_STATE_DIR/release.json") {
            & $env:TM_PWSH -NoProfile -File scripts/azure/Export-ReleaseJournal.ps1 -ConfigurationPath $env:TM_CONFIG -ReleasePath "$env:TM_STATE_DIR/release.json" -OutputPath "$env:TM_STATE_DIR/release-journal.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload selected release recovery metadata
        if: always() && inputs.operation != 'validate' && inputs.operation != 'foundation'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taskmanager-release-${{ env.TM_SHA }}-${{ github.run_id }}
          path: ${{ env.TM_STATE_DIR }}/release-journal.json
          include-hidden-files: true
          archive: true
          retention-days: 7
          if-no-files-found: ignore
      # Raw CLI state, parameters, tokens, environment config and logs are never artifacts.
