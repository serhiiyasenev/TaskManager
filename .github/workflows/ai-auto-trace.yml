name: 🧾 Auto Trace on Merge (ACE-FCA)

on:
  push:
    branches:
      - main

jobs:
  create-trace-entry:
    name: 🧩 Generate trace after merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Commit subjects and author names are untrusted data. Never interpolate
      # them directly into shell source through GitHub Actions expressions.
      - name: 📝 Create trace file
        run: |
          set -euo pipefail
          mkdir -p AI/traces
          TRACE_FILE="AI/traces/step-$(date -u +'%Y%m%d-%H%M%S').md"
          COMMIT_SHA="$(git rev-parse HEAD)"
          PR_URL="https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}"
          PR_TITLE="$(git log -1 --pretty=%s)"
          PR_AUTHOR="$(git log -1 --pretty=format:%an)"
          DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          {
            printf '# Trace Auto Entry — %s\n\n' "$(date -u +'%Y-%m-%d %H:%M UTC')"
            printf '**Date:** %s\n' "$DATE"
            printf '**Commit SHA:** \`%s\`\n' "$COMMIT_SHA"
            printf '**Author:** %s\n' "$PR_AUTHOR"
            printf '**Summary:** %s\n' "$PR_TITLE"
            printf '**Source:** [View Commit](%s)\n\n' "$PR_URL"
            printf '**Auto-generated trace entry after merge to main.**\n'
          } > "$TRACE_FILE"

          echo "Created $TRACE_FILE"

      - name: 🚀 Commit and push trace entry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add AI/traces/
          git commit -m "Auto trace entry after merge [skip ci]" || echo "No changes to commit."
          git push origin main || echo "Push skipped (no diff)."

      - name: ✅ Done
        run: echo "✅ Auto trace successfully created and committed."
