name: Regenerate patched dependency lockfile (temporary)

on:
  push:
    branches: [security/update-undici-20261104]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Use the npm version pinned by this workspace
        run: npm install --global npm@12.2.0
      - name: Regenerate lockfile without package lifecycle scripts
        run: npm update undici --package-lock-only --ignore-scripts --no-audit
      - name: Commit updated lockfile to security branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current"
          else
            git commit -m "fix(deps): regenerate npm lockfile with patched undici"
            git push origin "HEAD:refs/heads/${BRANCH_NAME}"
          fi
      - name: Verify install and high-severity audit
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
