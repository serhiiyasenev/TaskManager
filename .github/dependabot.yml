version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/src/frontend"
      - "/tests/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "nuget"
    directories:
      - "/src/backend/*"
      - "/tests/backend/*"
      - "/tools/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
